<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPU Utility Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-title mono">
          <span class="prompt">$</span> gpu-tracker
        </div>
        <div class="header-meta mono" id="meta">Loading dataset...</div>
      </header>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-label mono">AVG UTIL</div>
          <div class="stat-value mono" id="avgUtil">—</div>
          <div class="stat-unit mono">%</div>
        </div>

        <div class="stat-card">
          <div class="stat-label mono">MAX UTIL</div>
          <div class="stat-value mono" id="maxUtil">—</div>
          <div class="stat-unit mono">%</div>
        </div>

        <div class="stat-card">
          <div class="stat-label mono">MAX MEM</div>
          <div class="stat-value mono" id="maxMem">—</div>
          <div class="stat-unit mono">MiB</div>
        </div>

        <div class="stat-card">
          <div class="stat-label mono">SAMPLES</div>
          <div class="stat-value mono" id="points">—</div>
          <div class="stat-unit mono">rows</div>
        </div>
      </section>

      <section class="chart-section">
        <div class="section-header">
          <span class="section-title mono">telemetry.plot()</span>
          <span class="status-badge mono" id="chipStatus">IDLE</span>
        </div>
        <div class="chart-container">
          <canvas id="chart" width="360" height="150"></canvas>
        </div>
      </section>

      <section class="controls-section">
        <div class="section-header">
          <span class="section-title mono">dataset</span>
        </div>
        <div class="controls">
          <label class="file-label mono">
            <input id="file" type="file" accept="application/json" />
            <span class="file-button">Choose file</span>
          </label>
          <button id="reset" class="btn mono">Reset</button>
        </div>
        <div class="console mono" id="status">
          <div class="console-line dim">> awaiting input…</div>
        </div>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
